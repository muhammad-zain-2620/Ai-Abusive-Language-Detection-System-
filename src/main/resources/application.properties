spring.application.name=AI-Powered-Language-Detector
server.port=8080

# DATABASE (Docker MySQL)
spring.datasource.url=jdbc:mysql://mysql:3306/abuse_detector_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=abuse_user
spring.datasource.password=abuse_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

spring.profiles.active=docker
