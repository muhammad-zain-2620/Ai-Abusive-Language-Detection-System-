services:
  mysql:
    image: mysql:8.0
    container_name: abuse_mysql
    restart: always
    environment:
      MYSQL_DATABASE: abuse_detector_db
      MYSQL_USER: abuse_user
      MYSQL_PASSWORD: abuse_pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: abuse_app_test
    container_name: abuse_app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
